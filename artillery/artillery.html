<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projectile Motion Artillery</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">2D Projectile Motion Practice</p>
          <h1>Artillery Lab</h1>
        </div>
      </header>

      <section class="scenario-panel">
        <div class="section-heading-row">
          <h2>Round Information</h2>
          <strong id="attemptsRemaining" class="attempt-badge">
            Attempts remaining: 3
          </strong>
        </div>

        <div class="scenario-grid">
          <div class="info-card">
            <span class="info-label">Wall</span>
            <strong id="wallInfo">—</strong>
          </div>

          <div class="info-card">
            <span class="info-label">Target</span>
            <strong id="targetInfo">—</strong>
          </div>

          <div class="info-card">
            <span class="info-label">Given</span>
            <strong id="givenInfo">—</strong>
          </div>

          <div class="info-card">
            <span class="info-label">Solve For</span>
            <strong id="solveInfo">—</strong>
          </div>
        </div>
      </section>

      <section class="canvas-panel">
        <canvas id="gameCanvas"></canvas>
      </section>

      <section class="controls-panel">
        <h2>Choose Your Launch</h2>

        <div class="controls-grid">
          <div class="control-group">
            <div class="control-label-row">
              <label for="angleInput">Angle</label>
              <span>degrees</span>
            </div>

            <div class="dual-control">
              <input id="angleSlider" type="range" min="20" max="70" step="1" />

              <input id="angleInput" type="number" min="20" max="70" step="1" />
            </div>
          </div>

          <div class="control-group">
            <div class="control-label-row">
              <label for="speedInput">Launch Speed</label>
              <span>m/s</span>
            </div>

            <div class="dual-control">
              <input
                id="speedSlider"
                type="range"
                min="15"
                max="30"
                step="0.1"
              />

              <input
                id="speedInput"
                type="number"
                min="15"
                max="30"
                step="0.1"
              />
            </div>
          </div>
        </div>

        <div class="action-row">
          <button id="launchButton" class="button button-primary" type="button">
            Launch
          </button>

          <button
            id="newRoundButton"
            class="button button-secondary"
            type="button"
          >
            New Round
          </button>

          <p id="validationMessage" class="validation-message"></p>
        </div>
      </section>

      <section class="feedback-panel">
        <h2>Shot Feedback</h2>

        <div id="statusMessage" class="status-message status-neutral">
          Read the scenario, calculate your shot, then launch.
        </div>

        <div id="shotSummary" class="summary-list">
          <p class="summary-placeholder">
            Your launch data will appear here after the shot.
          </p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
